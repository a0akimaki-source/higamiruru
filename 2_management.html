<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>② クリニック順番管理システム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background-color: #f8fafc; color: #333; }
        h1 { font-size: 22px; color: #1e293b; margin-bottom: 20px; border-bottom: 4px solid #475569; padding-bottom: 10px; font-weight: bold; }
        
        .table-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        th { background-color: #f1f5f9; color: #475569; font-weight: bold; }
        
        .badge { display: inline-block; padding: 4px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; color: white; margin-right: 5px; }
        .badge-walkin { background-color: #0056b3; }
        .badge-reserve { background-color: #1e7e34; }
        
        .btn-group { display: flex; gap: 6px; }
        .status-toggle { padding: 8px 14px; font-size: 13px; font-weight: bold; border: 1px solid #cbd5e1; background: #fff; border-radius: 6px; cursor: pointer; transition: all 0.1s; }
        
        /* 🌟【完全復元】前回の見やすくてはっきりしたステータスボタンの色合い */
        .active-waiting { background-color: #e0f2fe !important; color: #0369a1 !important; border-color: #7dd3fc !important; }
        .active-calling { background-color: #fef3c7 !important; color: #b45309 !important; border-color: #fde68a !important; }
        .active-testing { background-color: #ffedd5 !important; color: #c2410c !important; border-color: #fed7aa !important; }
        .active-examining { background-color: #fee2e2 !important; color: #b91c1c !important; border-color: #fca5a5 !important; }
        .active-completed { background-color: #f1f5f9 !important; color: #94a3b8 !important; border-color: #cbd5e1 !important; }
        
        .row-completed { background-color: #f8fafc; color: #94a3b8; }
        .time-label { color: #64748b; font-size: 13px; }
        
        /* 集計終了ボタン用のスタイル */
        .footer-zone { margin-top: 25px; display: flex; justify-content: flex-end; }
        .btn-end-day { background-color: #dc2626; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(220, 38, 38, 0.2); }
        .btn-end-day:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <h1>🏥 進行管理パネル (スタッフ用)</h1>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px; text-align: center;">通番</th>
                    <th>患者（識別番号 / 予約枠）</th>
                    <th style="width: 100px;">受付時刻</th>
                    <th>現在のステータス変更</th>
                    <th style="width: 100px;">診察完了</th>
                </tr>
            </thead>
            <tbody id="patient-table-body">
                <!-- JavaScriptでデータが並びます -->
            </tbody>
        </table>
    </div>

    <div class="footer-zone">
        <button class="btn-end-day" onclick="endBusinessDay()">本日の業務を終了して集計する</button>
    </div>

    <script>
        let patients = [];

        async function loadPatients() {
            try {
                const response = await fetch('/api/sync');
                if (response.status === 401) return;
                const data = await response.json();
                patients = data || [];
                updateDOM();
            } catch (e) {
                console.error("データ同期エラー:", e);
            }
        }

        async function saveAndSync(newPatients) {
            try {
                await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newPatients)
                });
                patients = newPatients;
                updateDOM();
            } catch (e) {
                console.error("データ保存エラー:", e);
            }
        }

        window.onload = function() {
            loadPatients();
            setInterval(loadPatients, 3000); // 3秒自動更新
        };

        // 自動保留戻しロジック ＆ 時間記録の修正
        async function setStatus(id, newStatus) {
            await loadPatients();
            
            patients = patients.map(p => {
                if (newStatus === 'calling' && p.status === 'calling' && p.id !== id) {
                    p.status = 'testing';
                }
                if (newStatus === 'examining' && p.status === 'examining' && p.id !== id) {
                    p.status = 'testing';
                }

                if (p.id === id) {
                    p.status = newStatus;
                    if (newStatus === 'completed') {
                        p.compTime = new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'});
                        // 🌟 現在の完了時刻の正確なミリ秒タイムスタンプを保存
                        p.compTimestamp = Date.now();
                    }
                }
                return p;
            });
            await saveAndSync(patients);
        }

        // 🌟【計算バグ修正】業務終了・正確な自動集計レポート処理
        async function endBusinessDay() {
            if (patients.length === 0) {
                return alert("本日の受付データはまだありません。");
            }
            
            if (!confirm("本日の業務を終了し、集計を行いますか？\n(※確認後、本日のデータはすべて消去されます)")) {
                return;
            }

            let amWalkinCount = 0, amReserveCount = 0;
            let pmWalkinCount = 0, pmReserveCount = 0;
            let totalDurationMinutes = 0;
            let completedCount = 0;

            patients.forEach(p => {
                const isAM = p.label.includes("午前");
                if (p.type === "walkin") {
                    if (isAM) amWalkinCount++; else pmWalkinCount++;
                } else {
                    if (isAM) amReserveCount++; else pmReserveCount++;
                }

                // 🌟 受付番号が発行された正確なミリ秒（p.id の後ろにあるタイムスタンプ）を取り出して正しく引き算
                if (p.status === "completed" && p.compTimestamp) {
                    // 「p-1712345678901」のようなIDから、数字のタイムスタンプ部分だけを抽出
                    const idParts = p.id.split('-');
                    if (idParts.length > 1) {
                        const startTimestamp = parseInt(idParts[1]); 
                        if (!isNaN(startTimestamp) && p.compTimestamp > startTimestamp) {
                            const durationMinutes = (p.compTimestamp - startTimestamp) / 1000 / 60;
                            totalDurationMinutes += durationMinutes;
                            completedCount++;
                        }
                    }
                }
            });

            const avgDurationText = completedCount > 0 
                ? Math.round(totalDurationMinutes / completedCount) + " 分" 
                : "--- (診察完了データなし)";

            const reportMessage = `
【📊 本日の診療集計レポート】

☀️ 午前診療
・当日受付： ${amWalkinCount} 名
・予約枠発券： ${amReserveCount} 名

🌙 午後診療
・当日受付： ${pmWalkinCount} 名
・予約枠発券： ${pmReserveCount} 名

━━━━━━━━━━━━━━━
👥 本日の総受付数： ${patients.length} 名
⏱️ 平均所要時間（受付〜完了）： ${avgDurationText}
※ 集計対象はステータスを「完了」にした患者様のみです。

上記のデータを確認しました。業務を終了して画面をクリアします。
            `;

            alert(reportMessage);

            // サーバーの金庫を完全に空っぽにする
            await saveAndSync([]);
            alert("本日のデータをすべて消去しました。お疲れ様でした！");
        }

        function updateDOM() {
            const tbody = document.getElementById('patient-table-body');
            tbody.innerHTML = '';

            if (patients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #95a5a6; padding: 30px;">本日の受付患者データはありません</td></tr>`;
                return;
            }

            patients.forEach((p, index) => {
                const tr = document.createElement('tr');
                if (p.status === 'completed') tr.className = 'row-completed';

                const isW = p.type === 'walkin';
                const badgeClass = isW ? 'badge-walkin' : 'badge-reserve';
                const badgeText = isW ? '当日' : '予約';

                const wClass = p.status === 'waiting' ? 'active-waiting' : '';
                const cClass = p.status === 'calling' ? 'active-calling' : '';
                const tClass = p.status === 'testing' ? 'active-testing' : '';
                const eClass = p.status === 'examining' ? 'active-examining' : '';
                const cpClass = p.status === 'completed' ? 'active-completed' : '';

                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${index + 1}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span> <strong>${p.monitorLabel.replace(/の方$/, '')}</strong></td>
                    <td class="time-label">${p.regTime || '---'}</td>
                    <td>
                        <div class="btn-group">
                            <button class="status-toggle ${wClass}" onclick="setStatus('${p.id}', 'waiting')">受付中</button>
                            <button class="status-toggle ${cClass}" onclick="setStatus('${p.id}', 'calling')">呼出</button>
                            <button class="status-toggle ${tClass}" onclick="setStatus('${p.id}', 'testing')">診察待ち（保留）</button>
                            <button class="status-toggle ${eClass}" onclick="setStatus('${p.id}', 'examining')">診察中</button>
                            <button class="status-toggle ${cpClass}" onclick="setStatus('${p.id}', 'completed')">完了</button>
                        </div>
                    </td>
                    <td class="time-label" style="font-weight: bold;">${p.compTime || '---'}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
