<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>③ クリニック順番待ちモニター</title>
    <style>
        /* 全体の基本設定（画面からはみ出さないようスクロールを許可） */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background-color: #f7fafc; color: #1a202c; }
        
        /* 画面全体を「左3/4（受付順・保留）」と「右1/4（呼び出し・診察中）」に分割 */
        .main-layout { display: grid; grid-template-columns: 3fr 1fr; gap: 20px; min-height: calc(100vh - 40px); }
        
        /* 共通のボックスデザイン */
        .monitor-box { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 2px solid #e2e8f0; display: flex; flex-direction: column; }
        .box-title { font-size: 30px; font-weight: bold; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 3px solid #edf2f7; display: flex; align-items: center; gap: 10px; }
        
        /* 左側エリア（3/4幅）：上下2段構成 */
        .left-column { display: grid; grid-template-rows: 1fr 1fr; gap: 20px; }
        .waiting-box { border-top: 10px solid #007bff; }
        .waiting-title { color: #007bff; }
        .testing-box { border-top: 10px solid #e67e22; }
        .testing-title { color: #e67e22; }
        
        /* 🌟 必ず左詰めで上から順に並ぶようにグリッドルールを最適化（はみ出し対策） */
        .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px; flex-grow: 1; align-content: start; justify-content: start; }
        
        /* 🌟 マスの高さを固定値から可変（min-height）に変更し、隠れるのを防止 */
        .grid-item { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px 10px; font-size: 34px; font-weight: 900; text-align: center; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); min-height: 90px; box-sizing: border-box; }
        .grid-item .badge { font-size: 16px; padding: 2px 8px; border-radius: 4px; color: white; margin-bottom: 5px; font-weight: bold; }
        
        /* 右側エリア（1/4幅）：呼び出し中・診察中 */
        .right-column { border-top: 10px solid #e74c3c; }
        .active-title { color: #e74c3c; }
        
        .right-section { flex-grow: 1; display: grid; grid-template-rows: 1.2fr 1fr; gap: 20px; }
        .sub-block { background: #fafafa; border: 2px solid #edf2f7; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .sub-label { font-size: 24px; font-weight: bold; color: #4a5568; margin-bottom: 5px; }
        
        /* 呼び出し中の番号（超特大 52px ＋ 点滅） */
        .call-display { font-size: 52px; font-weight: 900; color: #92400e; background-color: #fffbeb; border: 3px solid #f1c40f; border-radius: 12px; width: 100%; padding: 15px 5px; animation: blink 1.2s infinite; box-sizing: border-box; }
        /* 小さな案内文（20px） */
        .call-subtext { font-size: 20px; color: #b45309; font-weight: bold; margin-top: 8px; }
        
        /* 診察中の番号（超特大 48px） */
        .exam-display { font-size: 48px; font-weight: 900; color: #741b1b; background-color: #fdf2f2; border: 3px solid #f8b4b4; border-radius: 12px; width: 100%; padding: 15px 5px; box-sizing: border-box; }
        
        /* バッジの色分け */
        .badge-walkin { background-color: #007bff; }
        .badge-reserve { background-color: #28a745; }
        
        @keyframes blink {
            0% { opacity: 1.0; background-color: #fff3cd; }
            50% { opacity: 0.6; background-color: #fcf3cf; }
            100% { opacity: 1.0; background-color: #fff3cd; }
        }
        
        .empty-grid-text { grid-column: span 5; text-align: center; color: #a0aec0; font-size: 26px; padding-top: 50px; font-weight: normal; }
        .none-text { font-size: 32px; color: #a0aec0; font-weight: normal; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- 🧩 左側エリア：3/4幅（上下2段） -->
        <div class="left-column">
            
            <!-- 上段：お待ちの方 -->
            <div class="monitor-box waiting-box">
                <div class="box-title waiting-title">☀️ お待ちの方（受付順）</div>
                <div id="waiting-grid" class="grid-container"></div>
            </div>
            
            <!-- 下段：保留・検査中 -->
            <div class="monitor-box testing-box">
                <div class="box-title testing-title">⏳ 診察待ち（保留・検査中）</div>
                <div id="testing-grid" class="grid-container"></div>
            </div>
            
        </div>
        
        <!-- 📢 右側エリア：1/4幅（呼び出し・診察中） -->
        <div class="monitor-box right-column">
            <div class="box-title active-title">🔔 現在の状況</div>
            <div class="right-section">
                
                <!-- 呼び出し中ブロック -->
                <div class="sub-block">
                    <div class="sub-label">📢 呼び出し中</div>
                    <div id="call-box" class="call-display"></div>
                    <div id="call-msg" class="call-subtext"></div>
                </div>
                
                <!-- 診察中ブロック -->
                <div class="sub-block">
                    <div class="sub-label">🩺 診察中</div>
                    <div id="exam-box" class="exam-display"></div>
                </div>
                
            </div>
        </div>
        
    </div>

    <script>
        let patients = [];

        // サーバーから最新データを自動で読み込む処理
        async function loadPatients() {
            try {
                const response = await fetch('/api/sync');
                if (response.status === 401) return;
                const data = await response.json();
                patients = data || [];
                updateDOM();
            } catch (e) {
                console.error("データ同期エラー:", e);
            }
        }

        window.onload = function() {
            loadPatients();
            setInterval(loadPatients, 3000); // 3秒ごとに自動更新
        };

        // 🌟【修正】「の方」をきれいに取り除く加工関数
        function cleanLabel(label) {
            if (!label) return '';
            return label.replace(/の方$/, '');
        }

        // 左側のマス（グリッドアイテム）を作る関数
        function createGridItem(p) {
            const div = document.createElement('div');
            div.className = 'grid-item';
            const badgeText = p.type === 'walkin' ? '当日' : '予約';
            const badgeClass = p.type === 'walkin' ? 'badge-walkin' : 'badge-reserve';
            // 🌟 文字列の加工を適用
            div.innerHTML = `<span class="badge ${badgeClass}">${badgeText}</span>${cleanLabel(p.monitorLabel)}`;
            return div;
        }

        function updateDOM() {
            const waitingGrid = document.getElementById('waiting-grid');
            const testingGrid = document.getElementById('testing-grid');
            const callBox = document.getElementById('call-box');
            const callMsg = document.getElementById('call-msg');
            const examBox = document.getElementById('exam-box');
            
            waitingGrid.innerHTML = '';
            testingGrid.innerHTML = '';
            
            const activePatients = patients.filter(p => p.status !== 'completed');
            
            // 1. お待ちの方
            const waiters = activePatients.filter(p => p.status === 'waiting');
            if (waiters.length === 0) {
                waitingGrid.innerHTML = '<div class="empty-grid-text">ただいまお待ちの方はいません</div>';
            } else {
                waiters.slice(0, 10).forEach(p => waitingGrid.appendChild(createGridItem(p)));
            }
            
            // 2. 保留・検査中
            const testers = activePatients.filter(p => p.status === 'testing');
            if (testers.length === 0) {
                testingGrid.innerHTML = '<div class="empty-grid-text">ただいま対象の方はいません</div>';
            } else {
                testers.slice(0, 10).forEach(p => testingGrid.appendChild(createGridItem(p)));
            }
            
            // 3. 📢 右側：呼び出し中
            const callers = activePatients.filter(p => p.status === 'calling');
            if (callers.length === 0) {
                callBox.className = 'none-text';
                callBox.textContent = 'なし';
                callMsg.textContent = '';
            } else {
                callBox.className = 'call-display';
                const p = callers[callers.length - 1];
                const badgeText = p.type === 'walkin' ? '当日 ' : '予約 ';
                // 🌟 「の方」を除去して表示
                callBox.textContent = badgeText + cleanLabel(p.monitorLabel);
                callMsg.textContent = '診察室の前の席でお待ちください';
            }
            
            // 4. 🩺 右側：診察中
            const examiners = activePatients.filter(p => p.status === 'examining');
            if (examiners.length === 0) {
                examBox.className = 'none-text';
                examBox.textContent = 'なし';
            } else {
                examBox.className = 'exam-display';
                const p = examiners[examiners.length - 1];
                const badgeText = p.type === 'walkin' ? '当日 ' : '予約 ';
                // 🌟 「の方」を除去して表示
                examBox.textContent = badgeText + cleanLabel(p.monitorLabel);
            }
        }
    </script>
</body>
</html>
