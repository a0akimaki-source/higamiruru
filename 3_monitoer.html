<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>③ クリニック順番待ちモニター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background-color: #f0f4f8; color: #333; }
        h1 { font-size: 24px; color: #2c3e50; text-align: center; margin-bottom: 25px; border-bottom: 3px solid #28a745; padding-bottom: 10px; }
        
        .monitor-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .monitor-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; min-height: 400px; }
        .box-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid #edf2f7; display: flex; align-items: center; gap: 8px; }
        
        .waiting-box { border-top: 6px solid #007bff; }
        .waiting-title { color: #007bff; }
        .testing-box { border-top: 6px solid #e67e22; }
        .testing-title { color: #e67e22; }
        
        .patient-list { list-style: none; padding: 0; margin: 0; }
        .patient-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; margin-bottom: 12px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0; font-size: 22px; font-weight: bold; }
        .item-calling { background-color: #fff3cd; border-color: #ffeeba; color: #856404; animation: blink 1.5s infinite; }
        
        .badge { display: inline-block; padding: 4px 10px; font-size: 14px; border-radius: 4px; color: white; margin-right: 10px; vertical-align: middle; }
        .badge-walkin { background-color: #007bff; }
        .badge-reserve { background-color: #28a745; }
        
        @keyframes blink {
            0% { opacity: 1.0; }
            50% { opacity: 0.4; }
            100% { opacity: 1.0; }
        }
        
        .empty-message { text-align: center; color: #a0aec0; padding: 5px 0; font-size: 16px; font-weight: normal; }
    </style>
</head>
<body>

    <h1>🏥 診察順番ご案内</h1>
    
    <div class="monitor-container">
        <!-- お待ちの方（受付順・呼出中） -->
        <div class="monitor-box waiting-box">
            <div class="box-title waiting-title">☀️ お待ちの方（受付順）</div>
            <ul id="waiting-list" class="patient-list"></ul>
        </div>
        
        <!-- 診察待ち（保留・検査中） -->
        <div class="monitor-box testing-box">
            <div class="box-title testing-title">⏳ 診察待ち（保留・検査中）</div>
            <ul id="testing-list" class="patient-list"></ul>
        </div>
    </div>

    <script>
        let patients = [];

        // 🌟【データ同期化】サーバーの金庫から最新データを自動で読み込む処理
        async function loadPatients() {
            try {
                const response = await fetch('/api/sync');
                if (response.status === 401) return; // 認証エラー時は中断
                const data = await response.json();
                patients = data || [];
                updateDOM(); // 画面の表示をリフレッシュする
            } catch (e) {
                console.error("データ同期エラー:", e);
            }
        }

        // 画面を開いた時と、その後3秒ごとに自動でデータを最新にする
        window.onload = function() {
            loadPatients();
            setInterval(loadPatients, 3000); 
        };

        function updateDOM() {
            const waitingList = document.getElementById('waiting-list');
            const testingList = document.getElementById('testing-list');
            
            waitingList.innerHTML = '';
            testingList.innerHTML = '';
            
            // 完了(completed)以外の患者を抽出
            const activePatients = patients.filter(p => p.status !== 'completed');
            
            // 1. お待ちの方（waiting または calling の状態）
            const waiters = activePatients.filter(p => p.status === 'waiting' || p.status === 'calling');
            if (waiters.length === 0) {
                waitingList.innerHTML = '<li class="empty-message">ただいまお待ちの方はいません</li>';
            } else {
                waiters.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'patient-item';
                    if (p.status === 'calling') li.className += ' item-calling';
                    
                    const badgeText = p.type === 'walkin' ? '当日' : '予約';
                    const badgeClass = p.type === 'walkin' ? 'badge-walkin' : 'badge-reserve';
                    
                    li.innerHTML = `<div><span class="badge ${badgeClass}">${badgeText}</span>${p.monitorLabel}</div>`;
                    waitingList.appendChild(li);
                });
            }
            
            // 2. 診察待ち（testing または examining の状態）
            const testers = activePatients.filter(p => p.status === 'testing' || p.status === 'examining');
            if (testers.length === 0) {
                testingList.innerHTML = '<li class="empty-message">ただいま対象の方はいません</li>';
            } else {
                testers.forEach(p => {
                    const li = document.createElement('li');
                    li.className = 'patient-item';
                    
                    const badgeText = p.type === 'walkin' ? '当日' : '予約';
                    const badgeClass = p.type === 'walkin' ? 'badge-walkin' : 'badge-reserve';
                    
                    li.innerHTML = `<div><span class="badge ${badgeClass}">${badgeText}</span>${p.monitorLabel}</div>`;
                    testingList.appendChild(li);
                });
            }
        }
    </script>
</body>
</html>
