<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>① クリニック発券・受付システム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 20px; background-color: #f0f4f8; color: #333; }
        h1 { font-size: 22px; color: #2c3e50; margin-bottom: 25px; border-bottom: 4px solid #007bff; padding-bottom: 10px; font-weight: bold; }
        
        /* 午前・午後の大きなブロック分け */
        .section-block { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); margin-bottom: 25px; border: 1px solid #cbd5e1; }
        .section-block.am-block { border-top: 5px solid #0056b3; }
        .section-block.pm-block { border-top: 5px solid #1e7e34; }
        
        .section-title { font-size: 20px; font-weight: bold; color: #2c3e50; margin: 0 0 15px 0; display: flex; align-items: center; gap: 8px; }
        h2 { font-size: 16px; color: #334155; margin: 20px 0 10px 0; border-left: 4px solid #94a3b8; padding-left: 8px; font-weight: bold; }
        h2.first-h2 { margin-top: 0; }

        /* 🌟 ボタンの横並び数を「10個固定」へ変更し、タブレットサイズで大きく押しやすく最適化 */
        .btn-group { display: grid; grid-template-columns: repeat(10, 1fr); gap: 10px; margin-bottom: 15px; }
        button { padding: 18px 4px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.08); transition: transform 0.1s; }
        button:active { transform: scale(0.95); }
        
        /* 🌟 ボタン背景色と文字色のコントラストを強め、見やすさを強化 */
        .btn-am-walkin { background-color: #0056b3; color: white; border: 1px solid #004085; }
        .btn-pm-walkin { background-color: #2b6cb0; color: white; border: 1px solid #2b6cb0; }
        .btn-reserve { background-color: #1e7e34; color: white; border: 1px solid #1c7430; }
        
        button:disabled { background-color: #cbd5e1 !important; color: #64748b !important; cursor: not-allowed; box-shadow: none; border-color: #94a3b8 !important; }
        
        /* 誤発券取消エリア */
        .cancel-zone { background: #fdf2f2; border: 1px solid #f5c6cb; padding: 15px; border-radius: 6px; margin-top: 15px; }
        .cancel-zone h3 { margin: 0 0 10px 0; font-size: 15px; color: #721c24; font-weight: bold; }
        .cancel-select { padding: 10px; font-size: 15px; width: 300px; margin-right: 10px; border-radius: 6px; border: 2px solid #cbd5e1; }
        .btn-cancel-submit { background-color: #dc3545; color: white; padding: 10px 20px; font-size: 14px; font-weight: bold; box-shadow: 0 3px 6px rgba(0,0,0,0.08); }
    </style>
</head>
<body>

    <h1>🏥 受付発券パネル</h1>
    
    <!-- ■■■ 午前診療ブロック ■■■ -->
    <div class="section-block am-block">
        <div class="section-title">☀️ 午前診療受付</div>
        
        <h2 class="first-h2">1. 当日受付 (1番 〜 20番)</h2>
        <div class="btn-group" id="am-walkin-btns"></div>

        <h2>2. 予約枠発券 (9:00 〜 11:30)</h2>
        <div class="btn-group" id="am-reserve-btns"></div>
    </div>

    <!-- ■■■ 午後診療ブロック ■■■ -->
    <div class="section-block pm-block">
        <div class="section-title">🌙 午後診療受付 (2:00〜)</div>
        
        <h2 class="first-h2">1. 当日受付 (1番 〜 20番)</h2>
        <div class="btn-group" id="pm-walkin-btns"></div>

        <h2>2. 予約枠発券 (2:00 〜 5:30)</h2>
        <div class="btn-group" id="pm-reserve-btns"></div>
    </div>

    <!-- 間違えて発券した場合の取消機能 -->
    <div class="cancel-zone">
        <h3>⚠️ 間違えて発券した場合の取り消し</h3>
        <select id="cancel-select-box" class="cancel-select">
            <option value="">-- 対象の番号/予約枠を選択 --</option>
        </select>
        <button class="btn-cancel-submit" onclick="submitCancel()">この発券を取り消す</button>
    </div>

    <script>
        let patients = [];

        // サーバーの金庫から最新データを自動で読み込む処理
        async function loadPatients() {
            try {
                const response = await fetch('/api/sync');
                if (response.status === 401) return;
                const data = await response.json();
                patients = data || [];
                updateButtonStates();
                updateCancelSelect();
            } catch (e) {
                console.error("データ同期エラー:", e);
            }
        }

        async function savePatients(newPatients) {
            try {
                await fetch('/api/sync', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newPatients)
                });
                patients = newPatients;
                updateButtonStates();
                updateCancelSelect();
            } catch (e) {
                console.error("データ保存エラー:", e);
            }
        }

        window.onload = function() {
            initButtons();
            loadPatients();
            setInterval(loadPatients, 3000); // 3秒ごとに自動同期
        };

        async function addPatient(label, monitorLabel, type, btnId) {
            await loadPatients();
            const patient = {
                id: 'p-' + Date.now() + Math.floor(Math.random()*100),
                label: label, 
                monitorLabel: monitorLabel, 
                type: type, 
                status: 'waiting', 
                btnId: btnId,
                regTime: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
            };
            const updated = [...patients, patient];
            await savePatients(updated);
        }

        async function submitCancel() {
            const selectBox = document.getElementById('cancel-select-box');
            const targetId = selectBox.value;
            if (!targetId) return alert('取り消す患者を選択してください。');
            
            if (confirm('この発券データを完全に削除してよろしいですか？')) {
                await loadPatients();
                const updated = patients.filter(p => p.id !== targetId);
                await savePatients(updated);
                selectBox.value = "";
            }
        }

        function updateButtonStates() {
            const allButtons = document.querySelectorAll('.btn-group button');
            allButtons.forEach(b => b.disabled = false);
            patients.forEach(p => {
                if (p.btnId) { const btn = document.getElementById(p.btnId); if(btn) btn.disabled = true; }
            });
        }

        function updateCancelSelect() {
            const selectBox = document.getElementById('cancel-select-box');
            const currentValue = selectBox.value;
            selectBox.innerHTML = '<option value="">-- 対象の番号/予約枠を選択 --</option>';
            
            patients.forEach(p => {
                if (p.status !== 'completed') {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = p.label;
                    selectBox.appendChild(opt);
                }
            });
            selectBox.value = currentValue;
        }

        function generateSlots12H(startHour, startMin, endHour, endMin, isPM = false) {
            const arr = [];
            let c = new Date(); c.setHours(startHour, startMin, 0, 0);
            let e = new Date(); e.setHours(endHour, endMin, 0, 0);
            
            while (c <= e) {
                let hh = c.getHours();
                if (isPM && hh >= 12) {
                    hh = hh - 12;
                    if (hh === 0) hh = 12;
                }
                const mm = String(c.getMinutes()).padStart(2, '0');
                arr.push(`${hh}:${mm}`);
                c.setMinutes(c.getMinutes() + 10);
            }
            return arr;
        }

        function initButtons() {
            // 1. 午前当日 (1〜20) ➔ 横並び10個×2段
            const amWBox = document.getElementById('am-walkin-btns');
            for (let i = 1; i <= 20; i++) {
                const b = document.createElement('button'); b.className = 'btn-am-walkin'; b.id = `amwb-${i}`; b.textContent = `${i}番`;
                b.onclick = () => addPatient(`午前 ${i}番`, `${i}番`, 'walkin', b.id); amWBox.appendChild(b);
            }

            // 2. 午前予約 (9:00〜11:30) ➔ 横並び10個の倍数で並びます
            const amRBox = document.getElementById('am-reserve-btns');
            const amSlots = generateSlots12H(9, 0, 11, 30, false);
            amSlots.forEach((t, i) => {
                const b = document.createElement('button'); b.className = 'btn-reserve'; b.id = `amb-${i}`; b.textContent = t;
                b.onclick = () => addPatient(`午前 予約 ${t}の方`, `${t}の方`, 'reserve', b.id); amRBox.appendChild(b);
            });

            // 3. 午後当日 (1〜20) ➔ 横並び10個×2段
            const pmWBox = document.getElementById('pm-walkin-btns');
            for (let i = 1; i <= 20; i++) {
                const b = document.createElement('button'); b.className = 'btn-pm-walkin'; b.id = `pmwb-${i}`; b.textContent = `${i}番`;
                b.onclick = () => addPatient(`午後 ${i}番`, `${i}番`, 'walkin', b.id); pmWBox.appendChild(b);
            }

            // 4. 午後予約 (14:00〜17:30) ➔ 横並び10個の倍数で並びます
            const pmRBox = document.getElementById('pm-reserve-btns');
            const pmSlots = generateSlots12H(14, 0, 17, 30, true);
            pmSlots.forEach((t, i) => {
                const b = document.createElement('button'); b.className = 'btn-reserve'; b.id = `pmb-${i}`; b.textContent = t;
                b.onclick = () => addPatient(`午後 予約 ${t}の方`, `${t}の方`, 'reserve', b.id); pmRBox.appendChild(b);
            });
        }
    </script>
</body>
</html>
